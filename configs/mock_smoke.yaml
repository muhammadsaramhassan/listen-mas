# CPU smoke test: scripted agents, fake captures with a planted signal on the malicious sender.
run_name: mock_smoke
out_dir: /tmp/runs
tasks:
  source: generate
  generate: {n: 8, seed0: 0, n_agents: 6, duplication: 2, shared_fraction: 0.4}
agents:
  n_whitebox: 2
  backends:
    whitebox:  {type: mock, planted_signal: 2.5}
    blackbox:  {type: mock}
malice: {enabled: true, agent: random_blackbox, tier: T1, rate: 0.3, n_claims: 3}
graph: {type: complete}
rounds: {max: 6, min: 3}
conditions: [honest, attacked]
seeds: [0]
