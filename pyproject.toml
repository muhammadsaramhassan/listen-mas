[project]
name = "listen-mas"
version = "0.1.0"
description = "Listener-side detection of malicious agents in mixed white-box/black-box LLM multi-agent systems"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "transformers>=4.51", "accelerate>=0.30", "scikit-learn>=1.4", "numpy>=1.26", "pyyaml>=6.0", "openai>=1.30"]

[tool.setuptools.packages.find]
include = ["listen*"]
